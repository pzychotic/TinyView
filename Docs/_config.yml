title: TinyView
description: A specialized viewer for 16/32-bit single channel images
remote_theme: pages-themes/cayman@v0.2.0
url: https://pzychotic.github.io
baseurl: /TinyView

# Social media / link preview (Open Graph + Twitter cards), emitted by {% seo %}.
# jekyll-seo-tag only reads `image` from page front matter, so inject it into
# every page via defaults. Override per page by setting `image:` there.
defaults:
  - scope:
      path: ''
    values:
      image: /assets/social-preview.png

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Repo metadata used by the theme header
github:
  repository_url: https://github.com/pzychotic/TinyView

# Exclude files not needed in the built site
exclude:
  - Screenshots.png
